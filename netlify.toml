[build]
  publish = "."
  functions = "netlify/functions"

# Rota raiz — redireciona para login (proteção gratuita)
[[redirects]]
  from = "/"
  to = "/login.html"
  status = 302

# Protege index.html — redireciona para login se não autenticado
[[redirects]]
  from = "/index.html"
  to = "/login.html"
  status = 302

# Rotas públicas — login e funções Netlify
[[redirects]]
  from = "/login.html"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/.netlify/*"
  to = "/.netlify/:splat"
  status = 200

# Cabeçalhos de segurança
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "no-store, no-cache, must-revalidate"
