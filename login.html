<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goya Hono · Loyalty Lab</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Montserrat:wght@300;400;500;600&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--navy-deep:#08151f;--navy-base:#0f2433;--teal:#2C5F7A;--teal-light:#5ba3c9;--cream:#e8f0f5;--cream-low:rgba(200,220,235,0.3);--cream-ghost:rgba(200,220,235,0.12);--border-soft:rgba(255,255,255,0.06);--error:#e07070;--success:#6ab89a}
  html,body{height:100%;background:var(--navy-deep);color:var(--cream);font-family:'Montserrat',sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .card{position:relative;width:100%;max-width:420px;background:var(--navy-base);border:1px solid var(--border-soft);border-radius:10px;overflow:hidden;box-shadow:0 32px 80px rgba(0,0,0,0.5)}
  .card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(91,163,201,0.4),transparent)}
  .card-header{padding:36px 40px 28px;text-align:center;border-bottom:1px solid var(--border-soft)}
  .logo-text{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:400;letter-spacing:0.2em;color:var(--cream);text-transform:uppercase;line-height:1;display:block}
  .logo-sub{font-size:8px;letter-spacing:0.28em;text-transform:uppercase;color:var(--cream-low);margin-top:6px;display:block}
  .card-body{padding:36px 40px 40px}
  .field{margin-bottom:18px}
  label{display:block;font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--cream-low);margin-bottom:8px}
  input{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:4px;padding:12px 16px;font-family:'Montserrat',sans-serif;font-size:13px;font-weight:300;color:var(--cream);outline:none;transition:border-color 0.2s}
  input::placeholder{color:rgba(200,220,235,0.2);font-size:12px}
  input:focus{border-color:rgba(91,163,201,0.4);background:rgba(255,255,255,0.06)}
  .btn{width:100%;padding:13px 20px;background:var(--teal);border:none;border-radius:4px;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;color:var(--cream);cursor:pointer;transition:background 0.2s;margin-top:8px}
  .btn:hover{background:#3a7a9c}
  .link-btn{background:none;border:none;color:var(--teal-light);font-family:'Montserrat',sans-serif;font-size:11px;cursor:pointer;padding:0;transition:opacity 0.2s}
  .link-btn:hover{opacity:0.7}
  .status-msg{min-height:18px;font-size:11px;line-height:1.5;margin-top:14px;text-align:center;color:var(--error)}
  .divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--cream-ghost);font-size:10px;letter-spacing:0.1em;text-transform:uppercase}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border-soft)}
  .card-footer{padding:16px 40px 20px;border-top:1px solid var(--border-soft);text-align:center}
  .card-footer p{font-size:10px;color:rgba(200,220,235,0.18);letter-spacing:0.08em}
  .step{display:none}
  .step.active{display:block;animation:fadeIn 0.3s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .step-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400;color:var(--cream);margin-bottom:6px}
  .step-desc{font-size:11px;color:var(--cream-low);line-height:1.7;margin-bottom:28px}
  .success-icon{width:52px;height:52px;border-radius:50%;background:rgba(106,184,154,0.1);border:1px solid rgba(106,184,154,0.25);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:22px}
</style>
</head>
