<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>Goya Hono — Acesso Restrito</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=DM+Mono:wght@300;400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a1a26;
  --surface: #0f2433;
  --border: rgba(255,255,255,0.08);
  --border-hover: rgba(91,163,201,0.4);
  --text: #e8f0f5;
  --muted: rgba(200,220,235,0.5);
  --accent: #2C5F7A;
  --accent-light: #5ba3c9;
  --error: #c94060;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Outfit', sans-serif;
  font-weight: 300;
}

/* Subtle background texture */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 20% 50%, rgba(44,95,122,0.15) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 20%, rgba(27,58,75,0.2) 0%, transparent 50%);
  pointer-events: none;
}

.page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  position: relative;
  z-index: 1;
}

/* Logo */
.logo-wrap {
  margin-bottom: 48px;
  text-align: center;
}

.logo-wrap img {
  height: 60px;
  width: auto;
  display: block;
  margin: 0 auto 12px;
}

.logo-label {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
}

/* Card */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 40px 44px;
  width: 100%;
  max-width: 400px;
}

.card-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 26px;
  font-weight: 300;
  color: var(--text);
  margin-bottom: 6px;
  letter-spacing: 0.01em;
}

.card-sub {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 32px;
  line-height: 1.6;
}

/* Form */
.field {
  margin-bottom: 18px;
}

.field label {
  display: block;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent-light);
  margin-bottom: 7px;
}

.field input {
  width: 100%;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 11px 14px;
  font-family: 'Outfit', sans-serif;
  font-size: 14px;
  font-weight: 300;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}

.field input:focus {
  border-color: var(--border-hover);
  background: rgba(91,163,201,0.05);
}

.field input::placeholder { color: rgba(200,220,235,0.25); }

/* MFA row */
.mfa-row {
  display: none;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
}
.mfa-row.visible { display: flex; }

.mfa-row .field { flex: 1; margin-bottom: 0; }

.mfa-resend {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--accent-light);
  background: none;
  border: none;
  cursor: pointer;
  white-space: nowrap;
  padding: 0;
  opacity: 0.7;
  transition: opacity 0.15s;
}
.mfa-resend:hover { opacity: 1; }

/* Submit */
.btn-login {
  width: 100%;
  padding: 13px;
  background: var(--accent);
  color: var(--text);
  border: none;
  border-radius: 3px;
  font-family: 'Outfit', sans-serif;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.03em;
  cursor: pointer;
  transition: background 0.2s, opacity 0.15s;
  margin-top: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-login:hover { background: #3a7a9e; }
.btn-login:disabled { opacity: 0.5; cursor: not-allowed; }

/* Spinner */
.spin {
  width: 14px; height: 14px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: none;
}
.btn-login.loading .spin { display: block; }
.btn-login.loading .btn-label { display: none; }

@keyframes spin { to { transform: rotate(360deg); } }

/* Messages */
.msg {
  font-size: 12px;
  padding: 10px 14px;
  border-radius: 3px;
  margin-bottom: 16px;
  line-height: 1.5;
  display: none;
}
.msg.visible { display: block; }
.msg.error { background: rgba(201,64,96,0.1); border: 1px solid rgba(201,64,96,0.25); color: #f0809a; }
.msg.success { background: rgba(91,163,201,0.08); border: 1px solid rgba(91,163,201,0.2); color: var(--accent-light); }
.msg.info { background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--muted); }

/* Domain note */
.domain-note {
  margin-top: 20px;
  text-align: center;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: rgba(200,220,235,0.2);
  letter-spacing: 0.08em;
}

/* Forgot password */
.forgot-link {
  display: block;
  text-align: right;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: rgba(91,163,201,0.5);
  margin-top: 6px;
  cursor: pointer;
  transition: color 0.15s;
  background: none;
  border: none;
  padding: 0;
}
.forgot-link:hover { color: var(--accent-light); }

/* Step indicator */
.steps {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 24px;
}
.step-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--border);
  transition: background 0.3s;
}
.step-dot.active { background: var(--accent-light); }
.step-dot.done { background: rgba(91,163,201,0.4); }
.step-line {
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* Footer */
.footer {
  margin-top: 32px;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: rgba(200,220,235,0.15);
  letter-spacing: 0.08em;
  text-align: center;
}
</style>
</head>

        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button class="forgot-link" onclick="handleForgot()">Esqueceu a senha?</button>

      <button class="btn-login" id="btn-step1" onclick="handleLogin()">
        <div class="spin"></div>
        <span class="btn-label">Entrar</span>
      </button>
    </div>

    <!-- Step 2: Código MFA -->
    <div id="step-2" style="display:none;">
      <div class="card-title">Verificação</div>
      <div class="card-sub">Enviamos um código de 6 dígitos para <strong id="email-shown" style="color:var(--accent-light);font-weight:400;"></strong></div>

      <div class="msg" id="msg-box-2"></div>

      <div class="field">
        <label>Código de verificação</label>
        <input type="text" id="mfa-code" placeholder="000000" maxlength="6" autocomplete="one-time-code"
          oninput="this.value=this.value.replace(/\D/g,'')"
          onkeydown="if(event.key==='Enter')handleMFA()" />
      </div>
      <button class="forgot-link" id="resend-btn" onclick="handleResend()">Reenviar código</button>

      <button class="btn-login" id="btn-step2" onclick="handleMFA()">
        <div class="spin"></div>
        <span class="btn-label">Verificar e acessar</span>
      </button>
    </div>

    <div class="domain-note">@copastur.com.br · @goyatravel.com.br</div>
  </div>

  <div class="footer">Biosfera Copastur · Goya Hono Loyalty Lab · Uso interno</div>
</div>

<script>
// ─── ALLOWED DOMAINS ───
const ALLOWED_DOMAINS = ['copastur.com.br', 'goyatravel.com.br'];

// ─── NETLIFY IDENTITY INIT ───
netlifyIdentity.on('init', user => {
  if (user) {
    window.location.href = '/';
  }
});

netlifyIdentity.on('login', user => {
  window.location.href = '/';
});

netlifyIdentity.on('error', err => {
  showMsg('msg-box', 'error', 'Erro de autenticação. Verifique suas credenciais.');
  setLoading('btn-step1', false);
});

// ─── HELPERS ───
function showMsg(id, type, text) {
  const el = document.getElementById(id);
  el.className = 'msg visible ' + type;
  el.textContent = text;
}

function hideMsg(id) {
  const el = document.getElementById(id);
  el.className = 'msg';
}

function setLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  if (loading) btn.classList.add('loading');
  else btn.classList.remove('loading');
  btn.disabled = loading;
}

function validateDomain(email) {
  const domain = email.split('@')[1] || '';
  return ALLOWED_DOMAINS.includes(domain);
}

// ─── STEP 1: LOGIN ───
function handleLogin() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  hideMsg('msg-box');

  if (!email || !password) {
    showMsg('msg-box', 'error', 'Preencha e-mail e senha.');
    return;
  }

  if (!validateDomain(email)) {
    showMsg('msg-box', 'error', 'Acesso permitido apenas para e-mails @copastur.com.br ou @goyatravel.com.br.');
    return;
  }

  setLoading('btn-step1', true);

  // Use Netlify Identity to authenticate
  netlifyIdentity.store.user = null;
  fetch('/.netlify/identity/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ grant_type: 'password', username: email, password: password })
  })
  .then(res => res.json())
  .then(data => {
    if (data.error) {
      showMsg('msg-box', 'error', 'E-mail ou senha incorretos.');
      setLoading('btn-step1', false);
      return;
    }
    // Store token temporarily, proceed to MFA step
    window._authToken = data.access_token;
    window._authEmail = email;
    sendMFACode(email);
  })
  .catch(() => {
    showMsg('msg-box', 'error', 'Erro de conexão. Tente novamente.');
    setLoading('btn-step1', false);
  });
}

// ─── MFA: SEND CODE VIA NETLIFY FUNCTION ───
function sendMFACode(email) {
  fetch('/.netlify/functions/send-mfa', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email })
  })
  .then(res => res.json())
  .then(data => {
    setLoading('btn-step1', false);
    if (data.ok) {
      goToStep2(email);
    } else {
      showMsg('msg-box', 'error', 'Erro ao enviar código. Tente novamente.');
    }
  })
  .catch(() => {
    setLoading('btn-step1', false);
    showMsg('msg-box', 'error', 'Erro ao enviar código de verificação.');
  });
}

function goToStep2(email) {
  document.getElementById('step-1').style.display = 'none';
  document.getElementById('step-2').style.display = 'block';
  document.getElementById('email-shown').textContent = email;
  document.getElementById('dot-1').className = 'step-dot done';
  document.getElementById('dot-2').className = 'step-dot active';
  document.getElementById('mfa-code').focus();

  // Resend cooldown
  startResendCooldown();
}

// ─── MFA: VERIFY CODE ───
function handleMFA() {
  const code = document.getElementById('mfa-code').value.trim();
  hideMsg('msg-box-2');

  if (code.length !== 6) {
    showMsg('msg-box-2', 'error', 'Digite o código de 6 dígitos.');
    return;
  }

  setLoading('btn-step2', true);

  fetch('/.netlify/functions/verify-mfa', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: window._authEmail, code })
  })
  .then(res => res.json())
  .then(data => {
    if (data.ok) {
      showMsg('msg-box-2', 'success', 'Verificado! Redirecionando...');
      // Set Netlify Identity session and redirect
      setTimeout(() => {
        localStorage.setItem('gotrue-session', JSON.stringify({
          access_token: window._authToken,
          expires_at: Date.now() + 3600000
        }));
        window.location.href = '/';
      }, 800);
    } else {
      showMsg('msg-box-2', 'error', data.message || 'Código incorreto ou expirado.');
      setLoading('btn-step2', false);
    }
  })
  .catch(() => {
    showMsg('msg-box-2', 'error', 'Erro de verificação. Tente novamente.');
    setLoading('btn-step2', false);
  });
}

// ─── RESEND COOLDOWN ───
function startResendCooldown() {
  const btn = document.getElementById('resend-btn');
  let seconds = 60;
  btn.disabled = true;
  btn.style.opacity = '0.3';
  btn.textContent = `Reenviar em ${seconds}s`;
  const timer = setInterval(() => {
    seconds--;
    btn.textContent = `Reenviar em ${seconds}s`;
    if (seconds <= 0) {
      clearInterval(timer);
      btn.disabled = false;
      btn.style.opacity = '0.7';
      btn.textContent = 'Reenviar código';
    }
  }, 1000);
}

function handleResend() {
  hideMsg('msg-box-2');
  showMsg('msg-box-2', 'info', 'Enviando novo código...');
  sendMFACode(window._authEmail);
  startResendCooldown();
}

// ─── FORGOT PASSWORD ───
function handleForgot() {
  const email = document.getElementById('email').value.trim();
  if (!email || !validateDomain(email)) {
    showMsg('msg-box', 'info', 'Digite seu e-mail corporativo acima para recuperar a senha.');
    return;
  }
  netlifyIdentity.requestPasswordRecovery(email);
  showMsg('msg-box', 'success', 'Link de recuperação enviado para ' + email);
}

// ─── ENTER KEY ───
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleLogin();
  });
});
</script>
</body>
</html>
