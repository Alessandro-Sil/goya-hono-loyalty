[build]
  publish = "."
  functions = "netlify/functions"

# Protege todas as rotas — redireciona para login se não autenticado
[[redirects]]
  from = "/*"
  to = "/login.html"
  status = 200
  conditions = {Role = ["authenticated"]}
  force = false

# Rotas públicas (login e assets da função)
[[redirects]]
  from = "/login.html"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/.netlify/*"
  to = "/.netlify/:splat"
  status = 200

# Cabeçalhos de segurança
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "no-store, no-cache, must-revalidate"

# Netlify Identity — habilitar no painel após deploy
[identity]
  # Configurar no painel: Settings > Identity > Enable
  # Invite only: Settings > Identity > Registration > Invite only
